<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>교회 네트워크 관리</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login-screen" class="screen">
    <div class="login-box">
      <div class="logo-mark">
        <svg viewBox="0 0 48 48" width="40" height="40" aria-hidden="true">
          <circle cx="24" cy="24" r="22" fill="#2563eb"/>
          <path d="M14 22a14 14 0 0 1 20 0" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <path d="M18 27a8 8 0 0 1 12 0" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <circle cx="24" cy="32" r="2.6" fill="white"/>
        </svg>
      </div>
      <h1>교회 네트워크 관리</h1>
      <input id="email" type="email" placeholder="관리자 이메일">
      <input id="password" type="password" placeholder="비밀번호">
      <button id="login-btn">로그인</button>
      <p id="login-error" class="error"></p>
    </div>
  </div>

  <div id="dashboard-screen" class="screen" style="display:none;">
    <header>
      <div class="brand">
        <svg viewBox="0 0 48 48" width="26" height="26" aria-hidden="true">
          <circle cx="24" cy="24" r="22" fill="#2563eb"/>
          <path d="M14 22a14 14 0 0 1 20 0" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <path d="M18 27a8 8 0 0 1 12 0" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <circle cx="24" cy="32" r="2.6" fill="white"/>
        </svg>
        <h1>교회 네트워크 관리</h1>
        <span id="role-badge" class="role-badge"></span>
      </div>
      <div class="header-controls">
        <button id="refresh-btn" class="icon-btn" title="지금 바로 새로고침">🔄</button>
        <div class="settings-wrap">
          <button id="settings-btn" class="icon-btn" title="설정">⚙️</button>
          <div id="settings-menu" class="dropdown-menu" hidden>
            <button id="my-info-btn">내 정보</button>
            <button id="logout-btn">로그아웃</button>
          </div>
        </div>
      </div>
    </header>
    <p id="last-updated" class="last-updated"></p>

    <div id="main-grid">
      <section class="card">
        <h2>접속 기기 (<span id="online-count">0</span>대 접속중)</h2>
        <div id="device-groups"></div>
      </section>

      <section class="card">
        <h2>사이트 차단</h2>
        <div class="row admin-only">
          <input id="domain-input" type="text" placeholder="예: youtube.com">
          <button id="add-domain-btn">차단 추가</button>
        </div>
        <ul id="blocklist"></ul>
      </section>

      <section class="card">
        <h2>최근 접속/해제 기록</h2>
        <ul id="event-list"></ul>
      </section>
    </div>
  </div>

  <!-- 설정 페이지 (모달) -->
  <div id="settings-modal" class="modal-overlay" hidden>
    <div class="modal-box">
      <div class="modal-header">
        <h2>설정</h2>
        <button id="settings-close-btn" class="icon-btn">✕</button>
      </div>

      <div class="modal-section">
        <label>로그인 계정</label>
        <p id="account-email" class="account-email">-</p>
      </div>

      <div class="modal-section">
        <label for="auto-refresh-select">자동 새로고침 주기</label>
        <select id="auto-refresh-select">
          <option value="0">끔 (수동 새로고침만 사용)</option>
          <option value="10">10초마다</option>
          <option value="20" selected>20초마다</option>
          <option value="30">30초마다</option>
        </select>
        <p class="modal-hint">공유기·기기 목록을 이 주기마다 자동으로 다시 불러옵니다.</p>
      </div>

      <div class="modal-section">
        <label>비밀번호 변경</label>
        <input id="current-password" type="password" placeholder="현재 비밀번호">
        <input id="new-password" type="password" placeholder="새 비밀번호 (6자 이상)">
        <button id="change-password-btn" style="width:100%; margin-top:4px;">비밀번호 변경</button>
        <p id="password-msg" class="modal-hint"></p>
      </div>

      <div class="modal-section admin-only">
        <label>계정 관리</label>
        <div id="account-list" class="account-list">불러오는 중...</div>
      </div>

      <button id="settings-done-btn">완료</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
